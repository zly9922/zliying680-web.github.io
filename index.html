
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Academic Paper Library</title>
  <style>
    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
      max-width: 900px;
      margin: 60px auto;
      padding: 0 24px;
      background: #fafbff;
      color: #253247;
    }
    h1 { color: #254c85; }
    .paper {
      background: white;
      padding: 24px;
      margin-top: 25px;
      border-radius: 12px;
      border: 1px solid #e4e9f1;
    }
    .tag {
      display: inline-block;
      background: #e8f0fe;
      color: #24538f;
      padding: 6px 12px;
      border-radius: 6px;
      margin: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>My Academic Paper Library</h1>
  <p>我的学术论文收藏与研究笔记</p>
  <hr>

  <div class="paper">
    <h2>生成式推荐与 Semantic ID</h2>
    <p>研究 Semantic ID 的构建、质量评价与码本稳定性。</p>
    <span class="tag">Generative Recommendation</span>
    <span class="tag">Semantic ID</span>
    <span class="tag">RQ-VAE</span>
  </div>

  <div class="paper">
    <h2>金融市场与政治言论</h2>
    <p>研究特朗普言论对黄金、原油等金融市场的影响。</p>
    <span class="tag">Financial Market</span>
    <span class="tag">Trump</span>
    <span class="tag">Event Study</span>
  </div>
</body>
</html>
