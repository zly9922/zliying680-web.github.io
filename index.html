<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Academic Paper Library</title><style>
:root{--blue:#315f91;--fg:#172c44;--muted:#677d91;--line:#e4ebf3;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,'Microsoft YaHei',sans-serif}header{background:white;border-bottom:1px solid var(--line)}.wrap{max-width:1040px;margin:auto;padding:0 24px}.nav{display:flex;justify-content:space-between;align-items:center;min-height:72px}.brand{font-weight:750;color:var(--blue);text-decoration:none;font-size:19px}.nav a{color:#62778a;margin-left:16px;text-decoration:none}h1{font-size:clamp(30px,4vw,46px);line-height:1.25;margin:0 0 15px}.hero{padding:50px 0 24px}.hero p{color:var(--muted);margin:0}.tools{display:flex;gap:12px;flex-wrap:wrap;padding:22px 0 14px}input,select{padding:12px 14px;border:1px solid #d8e2ed;border-radius:10px;background:white;color:var(--fg);font:inherit}input{flex:1;min-width:220px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}button{cursor:pointer;font:inherit}.filter,.tag{border:0;background:#e9f1fc;color:#315f91;border-radius:7px;padding:6px 11px}.filter.active{color:white;background:var(--blue)}.tag{font-size:13px;padding:3px 8px}.stats{font-size:14px;color:var(--muted);margin:0 0 13px}.paper{background:white;border:1px solid var(--line);border-radius:14px;margin-bottom:17px;padding:25px 28px;box-shadow:0 5px 20px #18375909}.meta{font-size:13px;color:var(--muted)}h2{font-size:clamp(19px,2.5vw,24px);line-height:1.45;color:#1a4068;margin:10px 0}.paper p{margin:0 0 16px;color:#52677c}.tags,.links{display:flex;gap:8px;flex-wrap:wrap}.links{gap:20px;margin-top:17px;align-items:center}.links a,.detail{font-size:14px;text-decoration:none;color:var(--blue);font-weight:600}.detail{border:0;background:none;padding:0}.note{white-space:pre-wrap;border-top:1px solid var(--line);margin-top:16px;padding-top:15px;color:#43596f}.status{padding:2px 7px;border-radius:6px;background:#edf3f8}footer{padding:35px 0;color:var(--muted);font-size:13px}.empty{text-align:center;color:var(--muted);padding:35px}[hidden]{display:none!important}@media(max-width:600px){.wrap{padding:0 16px}.tools{flex-direction:column}.tools>*{width:100%}.hero{padding-top:32px}.paper{padding:20px}}
</style></head><body><header><div class="wrap nav"><a class="brand" href="./">✦ My Research Library</a><nav><a href="#papers">论文</a><a href="#about">关于</a></nav></div></header><main class="wrap"><section class="hero"><h1>论文收藏与研究笔记</h1><p>记录重要论文 · 归纳核心方法 · 积累研究灵感</p></section><div class="tools"><input id="query" placeholder="搜索论文标题、摘要、标签、研究笔记…" aria-label="搜索论文"><select id="category" aria-label="研究方向"><option value="">全部研究方向</option></select><select id="status" aria-label="阅读状态"><option value="">全部阅读状态</option><option>待读</option><option>阅读中</option><option>已阅读</option><option>整理中</option></select></div><div class="filters" id="filters"></div><section id="papers"><div class="stats" id="stats"></div><div id="results"></div></section><footer id="about">My Academic Paper Library · 个人学术收藏站 · 以原始论文为准</footer></main><script>
// 要添加论文，只需在 PAPERS 数组中复制一条记录、修改字段，然后保存文件。
// 注意：示例研究专题并非已发表论文；论文链接留空时不会显示原文按钮。
const PAPERS=[
{id:'tiger',title:'Recommender Systems with Generative Retrieval',year:'2023',category:'生成式推荐',tags:['TIGER','Semantic ID','RQ-VAE'],summary:'TIGER 论文：通过残差量化构建物品语义 ID，并用生成模型进行推荐检索。',status:'已阅读',url:'https://arxiv.org/abs/2305.05065',notes:'重点：RQ-VAE 的多层码本、语义 ID 的生成和序列推荐过程。\n个人思考：可分析不同层的码字利用率及碰撞现象。'},
{id:'muon',title:'Muon: An optimizer for hidden layers in neural networks',year:'2024',category:'码本稳定性',tags:['Muon','正交更新','优化算法'],summary:'关于正交化矩阵更新的优化策略，可为码本稳定性研究提供方法启发。',status:'待读',url:'https://kellerjordan.github.io/posts/muon/',notes:'个人思考：需研究正交更新如何与语义对齐损失配合。'},
{id:'gris',title:'Neither Black nor White: Balancing Semantic and Collaborative Signals with Graph-Informed Semantic IDs (GrIS)',year:'2026',category:'SID质量评价',tags:['Semantic ID','协同信号','图模型'],summary:'探讨如何在 Semantic ID 构建中融合语义内容与协同关系。',status:'待读',url:'',notes:'示例条目，来自最初提供的博客截图。原文与详细笔记待补充。'},
{id:'topic',title:'特朗普言论对黄金与原油分钟级市场的影响（研究专题）',year:'2026',category:'金融市场',tags:['特朗普言论','黄金与原油','事件研究'],summary:'个人研究专题占位记录，不是已发表论文。',status:'整理中',url:'',notes:'拟统一使用 UTC 时间，研究金融市场在特朗普发布言论前后的反应。'}
];
let currentTag='全部';const get=id=>document.getElementById(id);function node(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e}
function buildFilters(){const options=['全部',...new Set(PAPERS.flatMap(p=>p.tags))],container=get('filters');container.replaceChildren();options.forEach(t=>{const b=node('button','filter'+(currentTag===t?' active':''),t);b.onclick=()=>{currentTag=t;buildFilters();render()};container.append(b)})}
function render(){const q=get('query').value.toLocaleLowerCase().trim(),category=get('category').value,status=get('status').value;const selected=PAPERS.filter(p=>(currentTag==='全部'||p.tags.includes(currentTag))&&(!category||p.category===category)&&(!status||p.status===status)&&[p.title,p.summary,p.category,p.notes,...p.tags].join(' ').toLocaleLowerCase().includes(q));get('stats').textContent=`显示 ${selected.length} / ${PAPERS.length} 条收藏`;const area=get('results');area.replaceChildren();if(!selected.length){area.append(node('div','empty','未找到符合条件的内容。'));return}selected.forEach(p=>{const card=node('article','paper');const meta=node('div','meta',p.year+' · '+p.category+' · ');meta.append(node('span','status',p.status));card.append(meta,node('h2','',p.title),node('p','',p.summary));const tags=node('div','tags');p.tags.forEach(t=>{const tag=node('button','tag',t);tag.onclick=()=>{currentTag=t;buildFilters();render();location.hash='papers'};tags.append(tag)});card.append(tags);const links=node('div','links');if(p.url&&/^https:\/\//.test(p.url)){const a=node('a','', '查看原文 ↗');a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';links.append(a)}const toggle=node('button','detail','阅读笔记 ＋'),notes=node('div','note',p.notes||'尚无笔记');notes.hidden=true;toggle.onclick=()=>{notes.hidden=!notes.hidden;toggle.textContent=notes.hidden?'阅读笔记 ＋':'收起笔记 −'};links.append(toggle);card.append(links,notes);area.append(card)})}
[...new Set(PAPERS.map(p=>p.category))].forEach(c=>{const option=node('option','',c);option.value=c;get('category').append(option)});get('query').addEventListener('input',render);get('category').addEventListener('change',render);get('status').addEventListener('change',render);buildFilters();render();
</script></body></html>
