<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文管理 · My Research Library</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f9fd;color:#1b3049;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1000px;margin:auto;padding:25px}h1{margin:5px 0 8px}p{color:#586d82}.panel{background:white;border:1px solid #e0e8f2;border-radius:14px;padding:24px;margin:18px 0;box-shadow:0 4px 18px #1a3f5f09}.toolbar{display:flex;flex-wrap:wrap;gap:10px}.primary,button{font:inherit;border:1px solid #d8e2ef;padding:9px 14px;border-radius:8px;background:white;cursor:pointer;color:#254c7e}.primary{background:#315f91;color:white;border-color:#315f91}.danger{color:#9f2940}label{font-size:14px;font-weight:650;display:block;margin:12px 0 5px}input,select,textarea{font:inherit;width:100%;border:1px solid #d6e0ed;border-radius:8px;padding:10px;background:white;color:#1b3049}textarea{min-height:90px}form{margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.item{display:flex;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid #e9edf3;padding:13px 0}.item small{color:#728399}.actions{display:flex;gap:8px}.hint{font-size:14px;color:#5e748e}.banner{background:#e9f1fc;padding:14px;border-radius:10px}#file{display:none}[hidden]{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:16px}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><a href="./">← 返回论文主页</a><h1>论文管理台</h1><p>填写表单来添加、编辑或删除论文。修改先保存在当前浏览器中；要公开发布，需下载 JSON 并上传 GitHub。</p><div class="banner"><strong>重要：</strong>本页面是公开可访问的编辑工具，不提供账号验证。其他访客只能修改自己的浏览器草稿，不能直接更改你的 GitHub 仓库。请勿输入私人资料。</div>
<section class="panel"><div class="toolbar"><button id="new" class="primary">＋ 新增论文</button><button id="download">⬇ 下载 papers.json（用于发布）</button><button id="import">↑ 导入 JSON 文件</button><input id="file" type="file" accept=".json,application/json"><button id="reset">重载网站已发布的数据</button></div><p id="notice" class="hint"></p><div id="items"></div></section>
<section class="panel" id="editor" hidden><h2 id="heading">新增论文</h2><form id="form"><label>论文标题 *</label><input name="title" required maxlength="350"><div class="grid"><div><label>年份</label><input name="year" placeholder="2026"></div><div><label>研究方向</label><input name="category" list="cats" placeholder="生成式推荐"><datalist id="cats"><option value="生成式推荐"><option value="SID质量评价"><option value="码本稳定性"><option value="金融市场"><option value="研究方法"></datalist></div></div><label>主题标签（逗号分隔）</label><input name="tags" placeholder="Semantic ID, RQ-VAE, 稳定性"><label>中文核心摘要</label><textarea name="summary"></textarea><div class="grid"><div><label>阅读状态</label><select name="status"><option>待读</option><option>阅读中</option><option>已阅读</option><option>整理中</option></select></div><div><label>论文原文链接（https://）</label><input name="url" type="url" placeholder="https://arxiv.org/..."></div></div><label>阅读笔记</label><textarea name="notes" rows="6"></textarea><div class="toolbar" style="margin-top:17px"><button class="primary" type="submit">保存到浏览器草稿</button><button type="button" id="cancel">取消</button></div></form></section>
</main><script>
const KEY='paper-library-draft-v2';let papers=[],edit=-1;
const $=s=>document.querySelector(s);function el(t,txt){const x=document.createElement(t);if(txt!==undefined)x.textContent=txt;return x}
function notify(s){$('#notice').textContent=s+'（当前草稿 '+papers.length+' 条）'}
function persist(){localStorage.setItem(KEY,JSON.stringify(papers));draw();notify('草稿已保存；如需网站更新，请下载并上传 papers.json')}
function draw(){let list=$('#items');list.replaceChildren();papers.forEach((p,i)=>{const row=el('div');row.className='item';const info=el('div');const title=el('strong',p.title);info.append(title,el('div',(p.year||'')+' · '+(p.category||'')+' · '+(p.status||'')));const actions=el('div');actions.className='actions';const editBtn=el('button','编辑');editBtn.onclick=()=>openEditor(i);const del=el('button','删除');del.className='danger';del.onclick=()=>{if(confirm('确认删除这条论文？')){papers.splice(i,1);persist()}};actions.append(editBtn,del);row.append(info,actions);list.append(row)})}
function openEditor(i){edit=i;$('#heading').textContent=i<0?'新增论文':'编辑论文';const p=i<0?{}:papers[i];for(const k of ['title','year','category','summary','status','url','notes'])$('#form').elements[k].value=p[k]|| (k==='status'?'待读':'');$('#form').elements.tags.value=(p.tags||[]).join(', ');$('#editor').hidden=false;$('#editor').scrollIntoView({behavior:'smooth',block:'start'})}
$('#form').onsubmit=e=>{e.preventDefault();const f=e.currentTarget.elements;const p={id:edit<0?'paper-'+Date.now():papers[edit].id,title:f.title.value.trim(),year:f.year.value.trim(),category:f.category.value.trim()||'未分类',tags:[...new Set(f.tags.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean))],summary:f.summary.value.trim(),status:f.status.value,url:f.url.value.trim(),notes:f.notes.value.trim()};if(!p.title)return;if(p.url&&!/^https:\/\//i.test(p.url)){alert('原文链接必须以 https:// 开头');return}if(edit<0)papers.unshift(p);else papers[edit]=p;$('#editor').hidden=true;persist()};
$('#new').onclick=()=>openEditor(-1);$('#cancel').onclick=()=>$('#editor').hidden=true;
$('#download').onclick=()=>{const blob=new Blob([JSON.stringify(papers,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=el('a');a.href=url;a.download='papers.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已下载数据文件；下一步上传到 GitHub 仓库根目录覆盖 papers.json')};
$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const p=JSON.parse(await file.text());if(!Array.isArray(p)||!p.every(x=>x&&typeof x.title==='string'&&Array.isArray(x.tags)))throw Error('需要包含 title、tags 的论文数组');if(confirm('导入将替换当前草稿，确定吗？')){papers=p;persist()}}catch(err){alert('导入失败：'+err.message)}e.target.value=''};
$('#reset').onclick=async()=>{if(!confirm('重新加载网站数据会覆盖本浏览器草稿。确定吗？'))return;try{const r=await fetch('./papers.json?t='+Date.now());if(!r.ok)throw Error(r.status);papers=await r.json();persist()}catch(e){alert('无法加载线上数据：'+e.message)}};
(async()=>{try{const saved=localStorage.getItem(KEY);if(saved){papers=JSON.parse(saved);notify('已恢复浏览器草稿')}else{const r=await fetch('./papers.json');if(!r.ok)throw Error(r.status);papers=await r.json();notify('已读取网站已发布的论文')}draw()}catch(e){notify('未读取到论文数据，请导入 papers.json 文件')}})();
</script></body></html>
